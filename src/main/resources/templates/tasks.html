<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Планувальник задач | ІО-45</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #f2f2f2; }
        .completed { text-decoration: line-through; color: gray; }
        .priority-high { color: red; font-weight: bold; }
        .priority-medium { color: darkorange; font-weight: bold; }
        .priority-low { color: green; }
        form { display: inline; }
        .form-container { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; }
    </style>
</head>
<body>
<h1>Лабораторна робота №3</h1>
<h2>Планувальник задач</h2>

<div class="form-container">
    <h3>Додати нову задачу</h3>
    <form th:action="@{/tasks/add}" method="post">
        <input type="text" name="title" placeholder="Назва задачі" required>
        <input type="date" name="date" required>
        <select name="priority">
            <option value="Високий">Високий</option>
            <option value="Середній">Середній</option>
            <option value="Низький">Низький</option>
        </select>
        <button type="submit">Додати</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>Назва</th>
        <th>Дата</th>
        <th>Пріоритет</th>
        <th>Статус</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <!-- Використання циклу each -->
    <tr th:each="task : ${tasks}">
        <td th:text="${task.title}" th:classappend="${task.completed} ? 'completed' : ''"></td>
        <td th:text="${task.date ?: 'Дата не вказана'}"></td>

        <!-- Використання елементу вибору switch/case -->
        <td th:switch="${task.priority}">
            <span th:case="'Високий'" class="priority-high" th:text="${task.priority}"></span>
            <span th:case="'Середній'" class="priority-medium" th:text="${task.priority}"></span>
            <span th:case="'Низький'" class="priority-low" th:text="${task.priority}"></span>
            <span th:case="*" th:text="${task.priority}"></span>
        </td>

        <!-- Використання умовного форматування if/unless -->
        <td>
            <span th:if="${task.completed}">Виконана</span>
            <span th:unless="${task.completed}">В процесі</span>
        </td>

        <td>
            <form th:unless="${task.completed}" th:action="@{/tasks/complete}" method="post">
                <input type="hidden" name="id" th:value="${task.id}">
                <button type="submit">Виконано</button>
            </form>
            <form th:action="@{/tasks/delete}" method="post">
                <input type="hidden" name="id" th:value="${task.id}">
                <button type="submit">Видалити</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
